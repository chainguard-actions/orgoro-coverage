name: Test with coverage thresholds (non-PR event exits early)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Copy the fixture coverage file to workspace so the action can find it
      - name: Prepare coverage file
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/coverage.xml" "$GITHUB_WORKSPACE/coverage.xml"

      - id: action
        uses: .
        with:
          coverageFile: coverage.xml
          token: ${{ github.token }}
          thresholdAll: "0.8"
          thresholdNew: "0.9"
          thresholdModified: "0.85"

      - name: Assert action succeeded with threshold inputs
        run: |
          echo "Action completed successfully with threshold inputs on non-PR event"
          echo "PASS: action accepts threshold inputs and exits early when event is not pull_request"
