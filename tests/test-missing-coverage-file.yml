name: Test missing coverage file handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          coverageFile: nonexistent-coverage.xml
          token: ${{ github.token }}
          thresholdAll: 0.0
          thresholdNew: 0.0
          thresholdModified: 0.0

      - name: Assert action failed (missing coverage file should cause failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (missing coverage file or non-PR context)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (non-PR context may have short-circuited file validation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
