name: Test sourceDir input accepted (non-PR event exits gracefully)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a coverage XML file with source directory
        run: |
          mkdir -p /tmp/myproject/src
          cat > /tmp/coverage-src.xml <<'EOF'
          <sources>
            <source>/tmp/myproject/src</source>
          </sources>
          <coverage version="6.0" timestamp="1633536330812" lines-valid="500" lines-covered="450" line-rate="0.9" branches-covered="0" branches-valid="0" branch-rate="0" complexity="0">
            <class branch-rate="0" complexity="0" filename="module.py" line-rate="0.9" name="module.py">
            </class>
          </coverage>
          EOF

      - id: action
        uses: .
        with:
          coverageFile: /tmp/coverage-src.xml
          token: ${{ github.token }}
          sourceDir: /tmp/myproject/src
          thresholdAll: "0.5"

      - name: Assert action completed successfully with sourceDir on non-PR event
        run: |
          echo "Action completed without error on workflow_dispatch event with sourceDir set"
          echo "PASS: action exits gracefully when event is not pull_request"
