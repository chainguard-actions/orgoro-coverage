name: Test optional inputs (title and sourceDir)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Copy the fixture coverage file to workspace so the action can find it
      - name: Prepare coverage file
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/coverage.xml" "$GITHUB_WORKSPACE/coverage.xml"

      - id: action
        uses: .
        with:
          coverageFile: coverage.xml
          token: ${{ github.token }}
          sourceDir: src
          title: "My Custom Coverage Report"
          thresholdAll: "0.5"

      - name: Assert action succeeded with optional inputs
        run: |
          echo "Action completed successfully with optional inputs on non-PR event"
          echo "PASS: action accepts title and sourceDir inputs and exits early when event is not pull_request"
