name: Test coverage threshold enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture coverage file
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/coverage.xml" "$GITHUB_WORKSPACE/coverage.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          coverageFile: coverage.xml
          token: ${{ github.token }}
          thresholdAll: 0.95
          thresholdNew: 0.95
          thresholdModified: 0.95

      - name: Assert action ran (success or graceful failure on sentinel repo/non-PR event)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (coverage thresholds met or PR context not available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — sentinel repo, non-PR event, or threshold not met)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
